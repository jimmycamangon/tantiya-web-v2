<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>Tantiya</title>
    <script>
      (function () {
        try {
          var p = localStorage.getItem("tantiya-theme");
          var dark = p === "dark" || ((p === null || p === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.style.colorScheme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0c0a09");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
